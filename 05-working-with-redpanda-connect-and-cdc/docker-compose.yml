name: rust-redpanda-cdc-workshop

services:
  postgres:
    image: postgres:17
    container_name: workshop-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d shop
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - workshop


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    container_name: workshop-redpanda

    command:
      - redpanda
      - start

      # Kafka API
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092

      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092

      # Schema Registry
      - --schema-registry-addr
      - 0.0.0.0:8081

      # Development mode
      - --mode
      - dev-container

      - --smp
      - "1"

      - --default-log-level=info

    ports:
      - "19092:19092"
      - "9644:9644"
      - "18081:8081"

    volumes:
      - redpanda-data:/var/lib/redpanda/data

    networks:
      - workshop


  console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: workshop-redpanda-console

    environment:
      CONFIG_FILEPATH: /tmp/config.yml

      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers:
            - redpanda:9092

        schemaRegistry:
          enabled: true
          urls:
            - http://redpanda:8081

        redpanda:
          adminApi:
            enabled: true
            urls:
              - http://redpanda:9644

    entrypoint: /bin/sh

    command:
      - -c
      - |
        echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml
        /app/console

    ports:
      - "8080:8080"

    depends_on:
      - redpanda

    networks:
      - workshop


  redpanda-connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: workshop-redpanda-connect

    command:
      - run
      - /connect.yaml

    volumes:
      - ./redpanda-connect/postgres-cdc.yaml:/connect.yaml:ro

    depends_on:
      postgres:
        condition: service_healthy

      redpanda:
        condition: service_started

    ports:
      - "4195:4195"

    networks:
      - workshop


networks:
  workshop:
    driver: bridge


volumes:
  postgres-data:
  redpanda-data: