[package]
name = "working-with-jsonschema-and-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = "0.3"
rdkafka = { version = "0.39", features = ["dynamic-linking"] }
dotenvy = "0.15"
anyhow = "1"
serde_json = "1"
schema_registry_converter = { version = "4.10", features = ["json", "easy"] }
tokio-stream = { version = "0.1", features = ["sync"] }
